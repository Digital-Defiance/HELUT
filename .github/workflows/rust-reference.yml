name: Rust reference checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Reference/Rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Frozen E256 KAT consumer
        run: >-
          cargo run --locked -- e256-kat
          --profile ../../Fixtures/enigma256_generation.json
          --bundle ../../Fixtures/enigma256_golden
          --receipt ../../logs/e256-v2-gen0-nlff-search.json
      - name: Checked-in Yosys fixture parity
        run: >-
          cargo run --locked -- yosys-parity
          --full-adder ../../Generated/Netlists/Examples/netlist.json
          --counter ../../Generated/Netlists/Examples/counter_netlist.json
          --toy-isa ../../Generated/Netlists/Examples/toy_isa_netlist.json
      - name: Consumer-only clean-tree guard
        working-directory: .
        run: |
          git diff --exit-code -- Fixtures Hardware Generated
          test -z "$(git status --porcelain=v1 --untracked-files=all -- Fixtures Hardware Generated)"
