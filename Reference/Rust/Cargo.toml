[package]
name = "helut-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "helut_reference"
path = "src/lib.rs"

[[bin]]
name = "helut-reference"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[lints.rust]
unsafe_code = "forbid"
